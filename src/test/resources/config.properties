# =============================================================================
# Device & App Configuration
# Credentials must NEVER be stored here — supply them via environment variables:
#   TRUDOC_PHONE, TRUDOC_PASSWORD          for the TruDoc app
#   SAUCEDEMO_USERNAME, SAUCEDEMO_PASSWORD for the Sauce Labs demo app
# =============================================================================

# --- TruDoc App (Android) ---
trudoc.deviceName=0123456789ABCDEF
trudoc.platformVersion=6.0
trudoc.appPackage=com.youclick.wecare
trudoc.appActivity=com.trudoc.signup.splash.SplashActivity
trudoc.appPath=Apk/TruDoc.apk
trudoc.appiumUrl=http://127.0.0.1:4723

# --- Sauce Labs My Demo App (Android emulator) ---
saucedemo.android.deviceName=emulator-5554
saucedemo.android.platformVersion=17
saucedemo.android.appPackage=com.saucelabs.mydemoapp.android
saucedemo.android.appActivity=com.saucelabs.mydemoapp.android.view.activities.SplashActivity
saucedemo.android.appPath=apps/Android.SauceLabs.Mobile.Sample.app.apk
saucedemo.android.appiumUrl=http://127.0.0.1:4723

# --- Sauce Labs My Demo App (iOS simulator) ---
saucedemo.ios.deviceName=iPhone 14
saucedemo.ios.platformVersion=16.0
saucedemo.ios.bundleId=com.saucelabs.mydemoapp.ios
saucedemo.ios.appPath=apps/iOS.SauceLabs.Mobile.Sample.app
saucedemo.ios.appiumUrl=http://127.0.0.1:4723
