name: Mobile Automation Tests

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [ master, main ]
    types: [ opened, synchronize, reopened ]

# Cancel in-flight runs for the same PR branch so resources aren't wasted
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Jobs ────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Compile check (fast gate) ──────────────────────────────────────────
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Compile source and tests
        run: mvn compile test-compile --no-transfer-progress

  # ── 2. Android UI tests ────────────────────────────────────────────────────
  android-tests:
    name: Android UI Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node (Appium)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download Sauce Labs Android demo app
        run: |
          mkdir -p apps
          APK_URL=$(curl -s https://api.github.com/repos/saucelabs/my-demo-app-android/releases/latest \
            | python3 -c "import json,sys; assets=json.load(sys.stdin)['assets']; print(next(a['browser_download_url'] for a in assets if a['name'].endswith('.apk') and 'androidTest' not in a['name']))")
          curl -fsSL -o apps/Android.SauceLabs.Mobile.Sample.app.apk "$APK_URL"

      - name: Install Appium + UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run Android tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            appium --base-path /wd/hub &
            sleep 8
            mvn test -Pandroid --no-transfer-progress
        env:
          SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            target/surefire-reports/
            Screenshots/

  # ── 3. iOS UI tests ────────────────────────────────────────────────────────
  ios-tests:
    name: iOS UI Tests
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node (Appium)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download Sauce Labs iOS demo app
        run: |
          mkdir -p apps
          ZIP_URL=$(curl -s https://api.github.com/repos/saucelabs/my-demo-app-ios/releases/latest \
            | python3 -c "import json,sys; assets=json.load(sys.stdin)['assets']; print(next(a['browser_download_url'] for a in assets if a['name'] == 'SauceLabs-Demo-App.Simulator.zip'))")
          curl -fsSL -o apps/iOS.SauceLabs.Mobile.Sample.app.zip "$ZIP_URL"
          cd apps && unzip -q iOS.SauceLabs.Mobile.Sample.app.zip
          APP=$(find . -name "*.app" -maxdepth 2 -type d | head -1)
          [ -n "$APP" ] && [ "$APP" != "./iOS.SauceLabs.Mobile.Sample.app" ] && mv "$APP" iOS.SauceLabs.Mobile.Sample.app
          ls -la

      - name: Boot iPhone 14 simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 14 " | grep -v "Plus\|Pro" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "Booting simulator UDID: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl list devices booted

      - name: Install Appium + XCUITest driver
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Start Appium server
        run: |
          appium --base-path /wd/hub &
          sleep 8

      - name: Run iOS tests
        run: mvn test -Pios --no-transfer-progress
        env:
          SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}

      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            target/surefire-reports/
            Screenshots/
